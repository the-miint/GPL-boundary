name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libz-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The build needs no CMake. No crate may depend on the cmake crate, which
      # the lock file shows whatever the cache restores. And since the runner
      # images ship a cmake, a cmake that fails is put first on PATH, so a
      # build script that runs one fails the build.
      - name: Build (fails if anything needs cmake)
        run: |
          if grep -qx 'name = "cmake"' Cargo.lock; then
            echo "Cargo.lock has the cmake crate; the build must not need CMake" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/no-cmake"
          printf '#!/bin/sh\necho "cmake was run; the build must not need it" >&2\nexit 1\n' \
            > "$RUNNER_TEMP/no-cmake/cmake"
          chmod +x "$RUNNER_TEMP/no-cmake/cmake"
          PATH="$RUNNER_TEMP/no-cmake:$PATH" cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libz-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  # Linux and macOS: on macOS the shell tests run under bash 3.2 and the BSD tools.
  scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: make test-scripts
